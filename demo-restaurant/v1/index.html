<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Samani Kitchen — digital QR menu" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Samani Kitchen · Menu</title>
  <link rel="icon" href="../../assets/images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/css/menu.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="header">
      <div class="header__brand">
        <img class="header__logo" src="../../assets/images/logo.svg" alt="" width="32" height="32" />
        <span class="header__title" id="restaurant-name">Samani Kitchen</span>
        <span class="table-badge" id="table-badge" hidden>Table 1</span>
      </div>
      <div class="header__actions">
        <a class="icon-btn" id="social-instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="20" x="2" y="2" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
        </a>
        <a class="icon-btn" id="social-facebook" href="#" target="_blank" rel="noopener" aria-label="Facebook">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </a>
        <a class="icon-btn" id="social-tripadvisor" href="#" target="_blank" rel="noopener" aria-label="TripAdvisor">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6.5" cy="13.5" r="2.5"/><circle cx="17.5" cy="13.5" r="2.5"/><path d="M12 4 10 7H4l2 2.5C4.5 11 4 12.5 4 14c0 3.3 2.7 6 6 6 1.5 0 2.9-.55 4-1.45 1.1.9 2.5 1.45 4 1.45 3.3 0 6-2.7 6-6 0-1.5-.5-3-2-4.5L20 7h-6l-2-3z"/></svg>
        </a>
        <a class="icon-btn" id="social-tiktok" href="#" target="_blank" rel="noopener" aria-label="TikTok">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.76a4.85 4.85 0 0 1-1.01-.07z"/></svg>
        </a>
        <button type="button" class="icon-btn" id="btn-location" aria-label="Location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        </button>
        <button type="button" class="icon-btn" id="btn-more" aria-label="More">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        </button>
      </div>
    </header>

    <div class="selectors">
      <select class="select" id="currency-select" aria-label="Currency"></select>
      <select class="select" id="language-select" aria-label="Language"></select>
    </div>

    <!-- Home -->
    <div class="view is-active" data-view="home">
      <nav class="category-nav" aria-label="Categories">
        <div class="category-nav__scroll" id="category-nav-list"></div>
      </nav>
      <main class="main">
        <div class="banners" id="banners"></div>
        <div id="menu-sections"></div>
      </main>
    </div>

    <!-- Saved -->
    <div class="view" data-view="saved">
      <div class="panel">
        <h1 class="panel__title" id="saved-title">Saved items</h1>
        <p class="empty-state" id="saved-empty" hidden></p>
        <div class="product-list" id="saved-list"></div>
      </div>
    </div>

    <!-- Feedback -->
    <div class="view" data-view="feedback">
      <div class="panel">
        <h1 class="panel__title" id="feedback-title">Share feedback</h1>
        <form class="feedback-form" id="feedback-form">
          <textarea class="textarea" id="feedback-input" required maxlength="1000"></textarea>
          <div class="feedback-success" id="feedback-success" hidden></div>
          <button type="submit" class="btn-primary" id="feedback-submit">Send feedback</button>
        </form>
      </div>
    </div>

  </div>

  <nav class="bottom-nav" aria-label="Main">
    <button type="button" class="bottom-nav__item is-active" data-nav="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span data-i18n="nav-home">Home</span>
    </button>
    <button type="button" class="bottom-nav__item" data-nav="saved">
      <span class="bottom-nav__icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        <span class="bottom-nav__badge" id="saved-count" hidden>0</span>
      </span>
      <span data-i18n="nav-saved">Saved</span>
    </button>
    <button type="button" class="bottom-nav__item" data-nav="feedback">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span data-i18n="nav-feedback">Feedback</span>
    </button>
  </nav>

  <!-- Product sheet -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet-product" role="dialog" aria-modal="true" aria-labelledby="sheet-product-title">
    <div class="sheet__handle"></div>
    <header class="sheet__header">
      <h2 class="sheet__title" id="sheet-product-title"></h2>
      <button type="button" class="icon-btn" data-sheet-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="sheet__body">
      <img class="sheet__image" id="sheet-product-image" alt="" />
      <div class="sheet__badges" id="sheet-product-badges"></div>
      <p class="sheet__desc" id="sheet-product-desc"></p>
      <p class="sheet__price" id="sheet-product-price"></p>
      <div class="sheet__actions">
        <button type="button" class="btn-primary" id="sheet-save-btn">Save</button>
      </div>
    </div>
  </div>

  <!-- More sheet -->
  <div class="sheet" id="sheet-more" role="dialog" aria-modal="true">
    <div class="sheet__handle"></div>
    <header class="sheet__header">
      <h2 class="sheet__title">More</h2>
      <button type="button" class="icon-btn" data-sheet-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="sheet__body">
      <div class="menu-list">
        <button type="button" class="menu-list__item" id="btn-share-more">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
          <span id="more-share-label">Share with friends</span>
        </button>
        <button type="button" class="menu-list__item" id="btn-location-more">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span id="more-location-label">Restaurant location</span>
        </button>
        <button type="button" class="menu-list__item" id="btn-share-menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span id="more-copy-label">Copy menu link</span>
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../../assets/js/menu.js" data-menu-data="../../data/demo-restaurant.json"></script>
</body>
</html>
